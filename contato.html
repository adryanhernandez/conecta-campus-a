        <a class="marca" href="index.html">Conecta Campus FIAP</a>

        class="botao-menu"

        aria-expanded="false"
        aria-controls="menu-principal"
        >
        <span>Menu</span> 
        <span class="icone-menu" aria-hideen="true">☰</span>
    </button>
        <nav

</header>
    <main class="container">
    <section class="secao">
        <h1>Entre em contato</h1>
        <p>Envie suas dúvidas, sugestões ou questões sobre acessibilidade no campus.</p>

        <form id="formulario-contato">

                <fieldset>
                    <legend>Contato</legend>
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome">
                    <small id="erro-nome" class="mensagem-erro"></small>

                    
                
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" placeholder="Digite seu email">
                    <small id="erro-email" class="mensagem-erro"></small>
                    <label for="assunto">Assunto:</label>
                    <select id="assunto" name="assunto">
                        <option value="">Selecione um assunto</option>
                        <option value="duvida">Dúvida</option>
                        <option value="sugestao">Sugestão</option>
                        <option value="acessibilidade">Acessibilidade</option>
                    </select>
                    <small id="erro-assunto" class="mensagem-erro"></small>
    
                    <label for="mensagem">Mensagem:</label>
                    <textarea id="mensagem" name="mensagem" placeholder="Digite sua mensagem"></textarea>
                    <small id="erro-mensagem" class="mensagem-erro"></small>
                    <input type="submit" name="enviar" value="Enviar">
                    <p id="mensagem-status" class="mensagem-status" role="status"></p>
                </fieldset>
            </form>


    </section>
</main>
